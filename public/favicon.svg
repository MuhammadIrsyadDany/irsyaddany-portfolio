<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B1B8E"/>
      <stop offset="50%" stop-color="#7E32D9"/>
      <stop offset="100%" stop-color="#9E5CF6"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F2FD"/>
      <stop offset="100%" stop-color="#E4D4FE"/>
    </linearGradient>
    <filter id="innerShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <!-- Subtle inner highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(228,212,254,0.25)" stroke-width="1"/>
  <!-- "ID" Text -->
  <text x="32" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="30" fill="url(#textGlow)" filter="url(#glow)" letter-spacing="-1">ID</text>
</svg>